<script>
  // Keep the router in charge of scroll position (a hash like #/s3 never matches an element id).
  history.scrollRestoration = "manual";
  if (/^#s\d$/.test(location.hash)) history.replaceState(null, "", "#/" + location.hash.slice(1));
  try { const t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("cdd.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>

<header class="mast">
